<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de libros con LocalStorage</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Lista de libros web de Armando</h1>

    <div class="container">

        <div class="formContainer">
            <label for="name">Nombre del libro:</label>
            <input type="text" id="name" placeholder="Ingresa el nombre del libro">
            
            <label for="price">Precio:</label>
            <input type="number" id="price" placeholder="Ingresa el precio del libro" min="1">
            
            <button id="addProduct">Agregar libro</button>
        </div>

      
        <table id="productsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>


    <script src="functions.js"></script>
</body>
</html>
